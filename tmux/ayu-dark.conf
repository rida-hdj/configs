set -g @ayu_bg "#0b0e14"
set -g @ayu_bg_alt "#0d1017"
set -g @ayu_fg "#bfbdb6"
set -g @ayu_comment "#565b66"
set -g @ayu_selection "#1b2733"
set -g @ayu_line "#151a1e"
set -g @ayu_red "#f07178"
set -g @ayu_orange "#ff8f40"
set -g @ayu_yellow "#ffb454"
set -g @ayu_green "#aad94c"
set -g @ayu_cyan "#95e6cb"
set -g @ayu_blue "#59c2ff"
set -g @ayu_purple "#d2a6ff"

set -g status-style "bg=#{@ayu_bg},fg=#{@ayu_fg}"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#[fg=#{@ayu_bg},bg=#{@ayu_orange},bold] #{pane_current_command} #[fg=#{@ayu_orange},bg=#{@ayu_bg}]#[fg=#{@ayu_bg},bg=#{?client_prefix,#{@ayu_red},#{@ayu_green}},bold] #S "

set -g window-status-format "#[fg=#{@ayu_comment},bg=#{@ayu_bg}] #I:#W "
set -g window-status-current-format "#[fg=#{@ayu_bg},bg=#{@ayu_blue},bold] #I:#W #[fg=#{@ayu_fg},bg=#{@ayu_bg},nobold]"
set -g window-status-activity-style "fg=#{@ayu_yellow},bg=#{@ayu_bg}"
set -g window-status-bell-style "fg=#{@ayu_red},bg=#{@ayu_bg}"
set -g window-status-separator ""

set -g pane-border-style "fg=#{@ayu_selection}"
set -g pane-active-border-style "fg=#{@ayu_blue}"

set -g message-style "bg=#{@ayu_selection},fg=#{@ayu_fg}"
set -g message-command-style "bg=#{@ayu_selection},fg=#{@ayu_fg}"

setw -g mode-style "bg=#{@ayu_selection},fg=#{@ayu_fg}"
setw -g clock-mode-colour "#59c2ff"
